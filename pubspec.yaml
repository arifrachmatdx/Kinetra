name: kinetra
description: Kinetra - Smart workout assistant with AI pose detection.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  camera: ^0.11.1
  google_mlkit_pose_detection: ^0.14.0
  permission_handler: ^11.4.0
  intl: ^0.20.2
  google_fonts: ^6.2.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/exercises/
